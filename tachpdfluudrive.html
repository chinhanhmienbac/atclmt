<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cắt & Tải PDF Lên Drive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        .btn { @apply font-bold py-2 px-4 rounded-lg transition-transform transform duration-150 ease-in-out; }
        .btn-primary { @apply bg-blue-600 text-white hover:bg-blue-700 active:scale-95; }
        .btn-secondary { @apply bg-red-500 text-white hover:bg-red-600 active:scale-95; }
        .btn-success { @apply bg-green-600 text-white hover:bg-green-700 active:scale-95; }
        
        /* Style cho trang PDF được chọn */
        .pdf-page-container {
            position: relative;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pdf-page-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .pdf-page-container.selected {
            border-color: #2563eb; /* Blue-600 */
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.3);
        }
        .check-icon {
            display: none;
            position: absolute;
            top: 5px;
            right: 5px;
            background: #2563eb;
            color: white;
            border-radius: 50%;
            padding: 2px;
        }
        .pdf-page-container.selected .check-icon {
            display: block;
        }
        #status a { @apply text-blue-600 hover:underline break-all; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <div class="container mx-auto p-6 max-w-5xl">
        <div class="bg-white p-8 rounded-xl shadow-lg">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold text-gray-800">Cắt & Tải PDF Lên Google Drive</h1>
                <p class="text-gray-600 mt-2">Bước 1: Chọn file - Bước 2: Chọn trang cần lấy - Bước 3: Tải lên Drive</p>
            </div>

            <div class="text-center my-6 pb-6 border-b border-gray-200">
                <button id="authorize_button" class="btn btn-primary">Đăng nhập Google</button>
                <button id="signout_button" class="btn btn-secondary" style="display: none;">Đăng xuất</button>
            </div>

            <div id="upload_section" style="display: none;">
                <div class="flex flex-col items-center justify-center space-y-4">
                    <label class="block">
                        <span class="sr-only">Chọn file PDF</span>
                        <input type="file" id="file_input" accept=".pdf" class="block w-full text-sm text-slate-500
                            file:mr-4 file:py-2 file:px-4
                            file:rounded-full file:border-0
                            file:text-sm file:font-semibold
                            file:bg-blue-50 file:text-blue-700
                            hover:file:bg-blue-100
                        "/>
                    </label>
                    <p id="file_loading_status" class="text-sm text-gray-500 italic"></p>
                </div>

                <div id="pdf_preview_area" class="mt-8 hidden">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold text-gray-700">Chọn các trang bạn muốn lưu:</h3>
                        <span id="selection_count" class="text-sm font-bold text-blue-600 bg-blue-100 px-3 py-1 rounded-full">Đã chọn: 0 trang</span>
                    </div>
                    
                    <div id="pdf_grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 max-h-[600px] overflow-y-auto p-2 border rounded-lg bg-gray-50">
                        </div>

                    <div class="mt-6 text-center">
                        <button id="process_upload_button" class="btn btn-success text-lg w-full md:w-1/2 shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
                            Xử lý & Tải lên Drive
                        </button>
                    </div>
                </div>
            </div>

            <div id="status" class="mt-6 text-center text-gray-700 font-medium text-lg"></div>
        </div>
    </div>

    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>

    <script type="text/javascript">
        // --- CẤU HÌNH API ---
        const CLIENT_ID = "775388048399-5cbs3abkkovo724jqf9rh5k4eo0jb3tt.apps.googleusercontent.com"; 
        const API_KEY = ""; 
        const DISCOVERY_DOCS = ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"];
        const SCOPES = "https://www.googleapis.com/auth/drive.file";
        const FOLDER_ID = "1uyHJHfNFLIdPQbYu1uF4zliORCM6QK3P";

        // --- DOM ELEMENTS ---
        const authorizeButton = document.getElementById('authorize_button');
        const signoutButton = document.getElementById('signout_button');
        const uploadSection = document.getElementById('upload_section');
        const fileInput = document.getElementById('file_input');
        const pdfPreviewArea = document.getElementById('pdf_preview_area');
        const pdfGrid = document.getElementById('pdf_grid');
        const processButton = document.getElementById('process_upload_button');
        const statusDiv = document.getElementById('status');
        const selectionCountSpan = document.getElementById('selection_count');
        const fileLoadingStatus = document.getElementById('file_loading_status');

        // --- BIẾN TOÀN CỤC ---
        let gapiInited = false;
        let gisInited = false;
        let tokenClient;
        
        // Lưu trữ dữ liệu PDF
        let originalPdfBytes = null; // File gốc dưới dạng ArrayBuffer
        let selectedPageIndices = new Set(); // Các trang được chọn (index bắt đầu từ 0)
        let currentFileName = "";

        // Thiết lập worker cho PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // --- 1. KHỞI TẠO GOOGLE API ---
        window.onload = () => {
            gapi.load('client', initializeGapiClient);
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: tokenResponseCallback,
            });
            gisInited = true;
            checkAuthAndEnableButtons();
        };

        async function initializeGapiClient() {
            await gapi.client.init({ apiKey: API_KEY, discoveryDocs: DISCOVERY_DOCS });
            gapiInited = true;
            checkAuthAndEnableButtons();
        }

        function checkAuthAndEnableButtons() {
            if (gapiInited && gisInited) authorizeButton.disabled = false;
        }

        function tokenResponseCallback(resp) {
            if (resp.error !== undefined) throw (resp);
            updateSigninStatus(true);
        }

        authorizeButton.onclick = () => tokenClient.requestAccessToken({ prompt: 'consent' });
        
        signoutButton.onclick = () => {
            const token = gapi.client.getToken();
            if (token !== null) {
                google.accounts.oauth2.revoke(token.access_token, () => {
                    gapi.client.setToken('');
                    updateSigninStatus(false);
                    statusDiv.textContent = 'Bạn đã đăng xuất.';
                });
            }
        };

        function updateSigninStatus(isSignedIn) {
            if (isSignedIn) {
                authorizeButton.style.display = 'none';
                signoutButton.style.display = 'inline-block';
                uploadSection.style.display = 'block';
            } else {
                authorizeButton.style.display = 'inline-block';
                signoutButton.style.display = 'none';
                uploadSection.style.display = 'none';
            }
        }

        // --- 2. XỬ LÝ ĐỌC FILE VÀ HIỂN THỊ PDF (VIEWER) ---
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Reset trạng thái
            currentFileName = file.name;
            selectedPageIndices.clear();
            updateSelectionCount();
            pdfGrid.innerHTML = ''; 
            pdfPreviewArea.classList.add('hidden');
            processButton.disabled = true;
            statusDiv.textContent = '';
            
            fileLoadingStatus.textContent = "Đang đọc file PDF...";

            try {
                // Đọc file thành ArrayBuffer
                const arrayBuffer = await file.arrayBuffer();
                originalPdfBytes = arrayBuffer;

                // Tải document bằng PDF.js để render thumbnail
                const loadingTask = pdfjsLib.getDocument(arrayBuffer);
                const pdf = await loadingTask.promise;
                
                fileLoadingStatus.textContent = `Đang tạo bản xem trước cho ${pdf.numPages} trang...`;
                pdfPreviewArea.classList.remove('hidden');

                // Loop qua từng trang để render
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    renderPageThumbnail(pdf, pageNum);
                }
                
                fileLoadingStatus.textContent = "";

            } catch (error) {
                console.error(error);
                statusDiv.textContent = "Lỗi khi đọc file PDF. Vui lòng thử lại.";
            }
        });

        async function renderPageThumbnail(pdf, pageNum) {
            const page = await pdf.getPage(pageNum);
            const scale = 0.5; // Scale nhỏ để làm thumbnail
            const viewport = page.getViewport({ scale: scale });

            // Tạo thẻ canvas
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            canvas.className = "w-full h-auto rounded shadow-sm pointer-events-none"; // pointer-events-none để click vào div cha

            // Render trang lên canvas
            const renderContext = {
                canvasContext: context,
                viewport: viewport
            };
            await page.render(renderContext).promise;

            // Tạo container bao quanh (để xử lý click chọn)
            const container = document.createElement('div');
            container.className = "pdf-page-container bg-white p-2 rounded-lg relative";
            container.dataset.pageIndex = pageNum - 1; // PDF.js trang bắt đầu từ 1, PDF-lib bắt đầu từ 0

            // Icon checkmark
            const checkIcon = document.createElement('div');
            checkIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>`;
            checkIcon.className = "check-icon";

            // Số trang
            const pageNumberLabel = document.createElement('div');
            pageNumberLabel.className = "text-center text-xs text-gray-500 mt-1 font-semibold";
            pageNumberLabel.innerText = `Trang ${pageNum}`;

            container.appendChild(checkIcon);
            container.appendChild(canvas);
            container.appendChild(pageNumberLabel);

            // Sự kiện click chọn trang
            container.onclick = () => {
                const index = parseInt(container.dataset.pageIndex);
                if (selectedPageIndices.has(index)) {
                    selectedPageIndices.delete(index);
                    container.classList.remove('selected');
                } else {
                    selectedPageIndices.add(index);
                    container.classList.add('selected');
                }
                updateSelectionCount();
            };

            pdfGrid.appendChild(container);
        }

        function updateSelectionCount() {
            const count = selectedPageIndices.size;
            selectionCountSpan.textContent = `Đã chọn: ${count} trang`;
            processButton.disabled = count === 0;
            if (count > 0) {
                processButton.textContent = `Cắt ${count} trang & Tải lên Drive`;
            } else {
                processButton.textContent = `Chọn ít nhất 1 trang`;
            }
        }

        // --- 3. XỬ LÝ CẮT FILE VÀ UPLOAD (PDF-LIB + DRIVE API) ---
        processButton.onclick = async () => {
            if (selectedPageIndices.size === 0) return;
            
            statusDiv.innerHTML = '<span class="text-blue-600 animate-pulse">Đang xử lý PDF và Tải lên...</span>';
            processButton.disabled = true;

            try {
                // 3a. TẠO FILE PDF MỚI TỪ CÁC TRANG ĐÃ CHỌN (Client-side)
                // Load file gốc
                const pdfDoc = await PDFLib.PDFDocument.load(originalPdfBytes);
                
                // Tạo file mới
                const newPdfDoc = await PDFLib.PDFDocument.create();
                
                // Copy các trang đã chọn (cần convert Set -> Array và sort để đúng thứ tự)
                const indicesArray = Array.from(selectedPageIndices).sort((a, b) => a - b);
                const copiedPages = await newPdfDoc.copyPages(pdfDoc, indicesArray);
                
                // Add trang vào file mới
                copiedPages.forEach((page) => newPdfDoc.addPage(page));
                
                // Lưu file mới thành mảng bytes
                const pdfBytes = await newPdfDoc.save();
                
                // Tạo Blob từ bytes để chuẩn bị upload
                const newBlob = new Blob([pdfBytes], { type: 'application/pdf' });
                
                // Đặt tên file mới
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
                const newFileName = `Cut_${timestamp}_${currentFileName}`;

                // 3b. UPLOAD LÊN GOOGLE DRIVE
                await uploadToDrive(newBlob, newFileName);

            } catch (error) {
                console.error("Lỗi xử lý:", error);
                statusDiv.textContent = `Đã xảy ra lỗi: ${error.message}`;
                processButton.disabled = false;
            }
        };

        async function uploadToDrive(blob, fileName) {
            const metadata = {
                name: fileName,
                mimeType: 'application/pdf',
                parents: [FOLDER_ID]
            };

            const formData = new FormData();
            formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            formData.append('file', blob);

            try {
                const accessToken = gapi.client.getToken().access_token;
                const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${accessToken}` },
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error.message);
                }

                const fileData = await response.json();
                
                // Hiển thị kết quả
                statusDiv.innerHTML = `
                    <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative">
                        <strong class="font-bold">Thành công!</strong>
                        <span class="block sm:inline">File mới đã được tạo và tải lên.</span>
                        <div class="mt-2">
                            <a href="https://drive.google.com/file/d/${fileData.id}/view" target="_blank" class="font-bold underline text-blue-600 hover:text-blue-800">
                                Xem file trên Drive tại đây
                            </a>
                        </div>
                    </div>
                `;
                
                // Reset sau khi thành công (tuỳ chọn)
                processButton.disabled = false;
                processButton.textContent = "Thực hiện lại";

            } catch (error) {
                throw error; // Ném lỗi để catch ở trên xử lý hiển thị
            }
        }
    </script>
</body>
</html>
