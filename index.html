        /* CSS cho nội dung trung tâm (từ index.HTML) */
        .circle-text {
            text-shadow: 0px 0px 5px rgba(0, 0, 0, 0.2);
        }
        .orbit-container {
            min-width: 300px;
            min-height: 300px;
            width: 80vh;
            height: 80vh;
            max-width: 800px;
            max-height: 800px;
        }

        @keyframes pulse-glow {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2), 
                            inset 0px -5px 10px rgba(0,0,0,0.4), 
                            0 0 10px #87CEEB;
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 15px 25px rgba(0, 0, 0, 0.3), 
                            inset 0px -5px 15px rgba(0,0,0,0.5), 
                            0 0 25px #87CEEB, 0 0 10px #ffffff;
            }
        }

        .orbit-circle {
            background: radial-gradient(circle at 35% 35%, #87CEEB, #0077b6);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2), inset 0px -5px 10px rgba(0,0,0,0.4);
            transition: left 2s cubic-bezier(0.25, 1, 0.5, 1), 
                        top 2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .orbit-circle:hover {
            transform: scale(1.1) translateY(-5px); 
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.3), inset 0px -5px 15px rgba(0,0,0,0.5);
        }

        .pulsating {
            animation: pulse-glow 4s ease-in-out infinite;
        }

        <!-- Script cho nội dung chính -->
        <script>
            const units = [
                { name: "CÁC TỔNG KHO TẠI HẢI PHÒNG", link: "tk.html" },
                { name: "CHI NHÁNH MIỀN BẮC", link: "mb.html" }
            ];
    
            const container = document.getElementById('main-container');
    
            function setupCircles() {
                container.querySelectorAll('.orbit-circle').forEach(el => el.remove());
    
                const unitCount = units.length;
                const containerSize = container.offsetWidth;
                const radius = containerSize * 0.37;
                const circleSize = containerSize * 0.22;
    
                units.forEach((unit, index) => {
                    const circle = document.createElement('a');
                    circle.href = unit.link;
                    circle.target = "_blank";
                    circle.rel = "noopener noreferrer";
                    
                    circle.className = 'orbit-circle absolute flex items-center justify-center p-2 rounded-full text-white text-center font-bold';
                    
                    circle.innerHTML = `<span class="circle-text">${unit.name}</span>`;
                    circle.style.width = `${circleSize}px`;
                    circle.style.height = `${circleSize}px`;
                    circle.style.fontSize = `${circleSize * 0.1}px`;
    
                    const initialX = (containerSize / 2) - (circleSize / 2);
                    const initialY = (containerSize / 2) - (circleSize / 2);
                    circle.style.left = `${initialX}px`;
                    circle.style.top = `${initialY}px`;
                    
                    container.appendChild(circle);
    
                    const angle = index * Math.PI; 
                    
                    const finalX = (containerSize / 2) + radius * Math.cos(angle) - (circleSize / 2);
                    const finalY = (containerSize / 2) + radius * Math.sin(angle) - (circleSize / 2);
    
                    setTimeout(() => {
                        circle.style.left = `${finalX}px`;
                        circle.style.top = `${finalY}px`;
                    }, 50);
    
                    setTimeout(() => {
                        circle.classList.add('pulsating');
                        circle.style.animationDelay = `${index * 0.3}s`;
                    }, 2000); 
                });
            }
            
            window.onload = setupCircles;
            window.onresize = setupCircles;
        </script>

        const centerTextPlugin = {
            id: 'centerText',
            afterDraw: function(chart) {
                if (chart.data.datasets.length === 0) return;
                const data = chart.data.datasets[0].data;
                if (data.length === 0) return;

                const executed = data[0] || 0;
                const remaining = data[1] || 0;
                const total = executed + remaining;
                const percentage = total > 0 ? Math.round((executed / total) * 100) : 0;
                const text = `${percentage}%`; 

                const ctx = chart.ctx;
                const {width, height} = chart;
                const x = width / 2;
                const y = height / 2;
                
                ctx.save();
                const fontSize = (height / 57).toFixed(2);
                ctx.font = `bold ${fontSize}em sans-serif`;
                ctx.fillStyle = chart.data.datasets[0].backgroundColor[0] || '#333';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                ctx.fillText(text, x, y);
                ctx.restore();
            }
        };
        Chart.register(centerTextPlugin);

        /**
         * Hàm tải và render biểu đồ cho 1 CSDL cụ thể
         */
        async function loadCharts(year, blockId, db) {
            const container = document.getElementById(blockId);
            if (!container) return;
            
            const statusDiv = container.querySelector('.status');
            const chartsContainer = container.querySelector('.charts-container');

            if (sidebarCharts[blockId]) {
                sidebarCharts[blockId].forEach(chart => chart.destroy());
            }
            sidebarCharts[blockId] = [];
            
            chartsContainer.innerHTML = '';
            statusDiv.className = 'status text-blue-600 font-normal'; 
            statusDiv.innerText = `Đang tải năm ${year}...`;

            try {
                const summaryRef = ref(db, `summary_data/${year}`);
                const summarySnap = await get(summaryRef);
                if (!summarySnap.exists()) throw new Error(`Chưa có dữ liệu.`);
                const summaryData = summarySnap.val();

                const parentQuery = ref(db, `congViecMe${year}`);
                const parentSnapshot = await get(parentQuery);
                if (!parentSnapshot.exists()) throw new Error(`Chưa có công việc mẹ.`);
                const parentsData = parentSnapshot.val();
                
                const parents = Object.keys(parentsData)
                    .map(id => ({ id, ...parentsData[id] }))
                    .sort((a, b) => a.id.localeCompare(b.id));

                if (parents.length === 0) {
                     statusDiv.innerText = `Không có dữ liệu.`;
                     return;
                }

                let htmlContent = '';
                for (const parent of parents) {
                    const parentId = parent.id;
                    const name = parent.noiDung || 'Chưa có tên';

                    htmlContent += `
                        <div class="summary-parent-card w-full mt-2 relative">
                            <!-- Hiển thị nội dung, bỏ thẻ title của toàn DB -->
                            <h3 class="text-sm font-bold text-blue-700">${convertTTForDisplay(parentId)}. ${name}</h3>
                            <div class="summary-charts-container">
                                <div class="chart-wrapper">
                                    <canvas id="${blockId}-cap1Chart-${parentId}"></canvas>
                                    <p>Cấp 1</p>
                                </div>
                                <div class="chart-wrapper">
                                    <canvas id="${blockId}-costChart-${parentId}"></canvas>
                                    <p>Chi phí</p>
                                </div>
                            </div>
                        </div>
                    `;
                }

                chartsContainer.innerHTML = htmlContent;
                statusDiv.innerText = ''; 

                for (const parent of parents) {
                    const parentId = parent.id;
                    const parentSummary = summaryData[parentId] || {};

                    const totalLeafNodesCap1 = parentSummary.totalLeafNodesCap1 || 0;
                    const executedLeafNodesCap1 = parentSummary.totalExecutedLeafNodesCap1 || 0;
                    const plannedCost = parent.chiPhi || 0;
                    const executedCost = parent.chiPhiThucHien || 0;

                    const cap1Ctx = document.getElementById(`${blockId}-cap1Chart-${parentId}`).getContext('2d');
                    sidebarCharts[blockId].push(new Chart(cap1Ctx, {
                        type: 'doughnut',
                        data: {
                            labels: ['Đã thực hiện', 'Chưa thực hiện'],
                            datasets: [{
                                data: [executedLeafNodesCap1, totalLeafNodesCap1 - executedLeafNodesCap1],
                                backgroundColor: ['#28a745', '#e9ecef'],
                                borderColor: ['#28a745', '#e9ecef'],
                                borderWidth: 1
                            }]
                        },
                        options: { responsive: true, cutout: '60%', plugins: { legend: { display: false } } }
                    })); 

                    const costCtx = document.getElementById(`${blockId}-costChart-${parentId}`).getContext('2d');
                    sidebarCharts[blockId].push(new Chart(costCtx, {
                        type: 'doughnut',
                        data: {
                            labels: ['Đã thực hiện', 'Còn lại'],
                            datasets: [{
                                data: [executedCost, plannedCost > executedCost ? plannedCost - executedCost : 0],
                                backgroundColor: ['#007bff', '#e9ecef'],
                                borderColor: ['#007bff', '#e9ecef'],
                                borderWidth: 1
                            }]
                        },
                        options: { responsive: true, cutout: '60%', plugins: { legend: { display: false } } }
                    }));
                }
            } catch (error) {
                console.error(`Lỗi tải biểu đồ ${blockId}:`, error);
                statusDiv.className = 'status text-red-500';
                statusDiv.innerText = `${error.message}`;
            }
        }

        /**
         * Thiết lập Menu chọn Năm ở vị trí trung tâm
         */
        function setupGlobalYearControl(allActiveDBs) {
            const yearSelect = document.getElementById('globalYearSelect');
            if(!yearSelect) return null;
            
            const currentYearValue = new Date().getFullYear();
            yearSelect.innerHTML = '';
            const years = [currentYearValue, currentYearValue + 1];
            for (let i = currentYearValue - 1; i >= currentYearValue - 3; i--) {
                years.unshift(i);
            }
            years.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                yearSelect.appendChild(option);
            });
            yearSelect.value = currentYearValue;

            // Khi đổi năm => Cập nhật toàn bộ CSDL
            yearSelect.addEventListener('change', () => {
                const year = yearSelect.value;
                allActiveDBs.forEach(item => loadCharts(year, item.blockId, item.dbObj));
            });
            
            return currentYearValue;
        }

        function setupSidebarDBSelector(sidebarId, dbConfigsForSide) {
            const container = document.getElementById(sidebarId);
            const dbSelect = container.querySelector('.dbSelect');
            if (!dbSelect) return;

            dbSelect.innerHTML = ''; // Clear
            dbConfigsForSide.forEach(db => {

                option.value = `block-${db.id}`;
                option.textContent = db.title;
                dbSelect.appendChild(option);
            });

            // Sự kiện đưa Block lên đầu
            dbSelect.addEventListener('change', (e) => {
                const selectedBlockId = e.target.value;
                const blockDOM = document.getElementById(selectedBlockId);
                const headerControls = container.querySelector('.header-controls');
                
                // insertAdjacentElement 'afterend' sẽ đưa blockDOM này chèn ngay phía dưới headerControls 
                // => Đẩy các DB khác xuống dưới
                if (blockDOM && headerControls) {
                    headerControls.insertAdjacentElement('afterend', blockDOM);
                }
            });
        }

        /**
         * Khởi tạo hệ thống
         */
        // Thêm biến toàn cục để lưu cấu hình và DB kết nối
        window.activeDatabaseInstances = [];
		
		function initializeSystem() {
            ['left-sidebar-content', 'right-sidebar-content'].forEach(sideId => {
                const container = document.getElementById(sideId);
                const oldStatus = container.querySelector('.status');
                const oldCharts = container.querySelector('.charts-container');
                if(oldStatus) oldStatus.style.display = 'none';
                if(oldCharts) oldCharts.style.display = 'none';
            });

            const allActiveDBs = [];
            const leftDBConfigs = [];
            const rightDBConfigs = [];

            databaseConfigs.forEach(dbConfig => {
                const isLeft = dbConfig.side === 'left';
                const parentContainer = document.getElementById(isLeft ? 'left-sidebar-content' : 'right-sidebar-content');
                const blockId = `block-${dbConfig.id}`;

                // Tạo khung cho DB - LƯU Ý: Không render thẻ H2 chứa Title nữa
                const dbBlockHTML = `
                    <div id="${blockId}" class="mt-4 pt-3 border-t border-gray-300 db-block transition-all duration-300">
                        <div class="flex flex-col items-center mb-1">
                            <div class="connection-status text-xs italic">Khởi tạo kết nối...</div>
                        </div>
                        <div class="status text-center text-sm font-bold my-1"></div>
                        <div class="charts-container flex flex-col items-center gap-2"></div>
                    </div>
                `;
                parentContainer.insertAdjacentHTML('beforeend', dbBlockHTML);
                
                const blockDOM = document.getElementById(blockId);
                const connectionStatus = blockDOM.querySelector('.connection-status');

                try {
                    const app = initializeApp(dbConfig.config, dbConfig.id);
                    if (dbConfig.recaptchaSiteKey) {
                        initializeAppCheck(app, {
                            provider: new ReCaptchaV3Provider(dbConfig.recaptchaSiteKey),
                            isTokenAutoRefreshEnabled: true
                        });
                    }
                    const db = getDatabase(app);
                    
                    connectionStatus.textContent = 'Đã kết nối';
                    connectionStatus.style.color = '#28a745';
					
				// === SỬA DÒNG NÀY: Bổ sung dbConfig ===
                    const itemData = { blockId, dbObj: db, config: dbConfig }; 
                    allActiveDBs.push(itemData);
                    window.activeDatabaseInstances.push(itemData); // Lưu vào biến toàn cục

                    if (isLeft) {
                        leftDBConfigs.push(dbConfig);
                    } else {
                        rightDBConfigs.push(dbConfig);
                    }

                } catch (error) {
                    console.error(`Lỗi DB ${dbConfig.id}:`, error);
                    connectionStatus.textContent = 'Kết nối thất bại';
                    connectionStatus.style.color = '#dc3545';
                    blockDOM.querySelector('.status').innerText = error.message;
                }
            });

            // Gắn danh sách CSDL vào dropdown tương ứng
            setupSidebarDBSelector('left-sidebar-content', leftDBConfigs);
            setupSidebarDBSelector('right-sidebar-content', rightDBConfigs);

            // Gắn sự kiện chọn Năm (Global)
            const initialYear = setupGlobalYearControl(allActiveDBs);
            if (initialYear) {
                // Tải dữ liệu mặc định ban đầu cho tất cả
                allActiveDBs.forEach(item => loadCharts(initialYear, item.blockId, item.dbObj));
            }
        }
		// =====================================================================
        // CHỨC NĂNG XUẤT BÁO CÁO EXCEL TỔNG HỢP VÀO FILE Bieumau.xlsx (V2 - CÓ CÔNG THỨC & STYLE)
        // =====================================================================
        window.exportBaoCao = async function() {
            const btn = document.getElementById('btnExportExcel');
            const originHtml = btn.innerHTML;
            const yearSelect = document.getElementById('globalYearSelect');
            const year = yearSelect ? yearSelect.value : new Date().getFullYear();

            try {
                btn.innerHTML = "⏳ Đang tải Template...";
                btn.disabled = true;

                // 1. Tải Template Bieumau.xlsx
                const res = await fetch('Bieumau.xlsx');
                if (!res.ok) throw new Error("Không tìm thấy file Bieumau.xlsx trên server.");
                const buffer = await res.arrayBuffer();
                const workbook = new ExcelJS.Workbook();
                await workbook.xlsx.load(buffer);

                // --- HÀM HELPER SẮP XẾP ---
                const convertTT = (tt) => String(tt || '').replace(/,/g, '.');
                const r2n = (r) => {
                    if(!r) return 0;
                    const m={'I':1,'V':5,'X':10,'L':50,'C':100,'D':500,'M':1000};
                    let s=0; const str=String(r).toUpperCase();
                    for(let i=0;i<str.length;i++){
                        const c=m[str[i]], n=m[str[i+1]];
                        if(n&&c<n) s-=c; else s+=c;
                    }
                    return s;
                };
                const sortC = (a,b) => r2n(a.id) - r2n(b.id);
                const sortN = (a,b) => {
                    const pa=String(a.id).split(',').map(Number), pb=String(b.id).split(',').map(Number);
                    for(let i=0;i<Math.max(pa.length,pb.length);i++){
                        const va=pa[i]||0, vb=pb[i]||0;
                        if(va!==vb) return va-vb;
                    }
                    return 0;
                };

                // --- HÀM TÌM SỐ LẦN THỰC HIỆN MAX TRONG 1 NHÁNH ---
                const findMaxExecutions = (node) => {
                    let max = 0;
                    const traverse = (n) => {
                        if (n.executions) {
                            for(let k in n.executions) {
                                const idx = parseInt(n.executions[k].lanThucHien || k, 10);
                                if (!isNaN(idx) && idx > max) max = idx;
                            }
                        }
                        if (n.children) Object.values(n.children).forEach(traverse);
                        if (n.grandchildren) Object.values(n.grandchildren).forEach(traverse);
                        if (n.greatGrandchildren) Object.values(n.greatGrandchildren).forEach(traverse);
                        if (n.greatGreatGrandchildren) Object.values(n.greatGreatGrandchildren).forEach(traverse);
                    };
                    traverse(node);
                    return max;
                };

                // --- HÀM SETUP HEADER CHO SHEET ---
                const setupWorksheetHeader = (ws, maxExec) => {
                    ws.properties.outlineProperties = { summaryBelow: false, summaryRight: false };
                    
                    const cols = [
                        { header: 'TT', width: 10, style: { numFmt: '@' } }, 
                        { header: 'Nội dung công việc', width: 50, style: { alignment: { wrapText: true } } },
                        { header: 'Tag Name', width: 12 }, { header: 'ĐV th.hiện', width: 15 },
                        { header: 'Tần suất TH', width: 10, style: { alignment: { horizontal: 'center' } } },
                        { header: 'Đ.vị tính', width: 10, style: { alignment: { horizontal: 'center' } } },
                        { header: 'Số lượng', width: 10, style: { numFmt: '#,##0' } },
                        { header: 'Chi phí KH', width: 18, style: { numFmt: '#,##0' } },
                        { header: 'Chi phí thực hiện', width: 18, style: { numFmt: '#,##0' } },
                        { header: 'Kế hoạch còn lại', width: 18, style: { numFmt: '#,##0' } },
                        { header: 'Năm phân bổ', width: 10, style: { alignment: { horizontal: 'center' } } },
                        { header: 'CP phân bổ', width: 15, style: { numFmt: '#,##0' } },
                        { header: 'Cấp độ', width: 8, style: { alignment: { horizontal: 'center' } } },
                        { header: 'CP CĐ1', width: 15, style: { numFmt: '#,##0' } }
                    ];

                    for (let i = 1; i <= maxExec; i++) {
                        cols.push(
                            { header: `Ngày TH (${i})`, width: 12, style: { numFmt: '@' } },
                            { header: `Số lượng (${i})`, width: 10, style: { numFmt: '#,##0' } },
                            { header: `Đơn giá (${i})`, width: 15, style: { numFmt: '#,##0' } },
                            { header: `Thành tiền (${i})`, width: 18, style: { numFmt: '#,##0' } }
                        );
                    }
                    ws.columns = cols;
                    
                    const headerRow = ws.getRow(1);
                    headerRow.font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 10 };
                    headerRow.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0070C0' } };
                    headerRow.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
                };

                // --- THUẬT TOÁN ĐỆ QUY TẠO DÒNG CÓ CÔNG THỨC ---
                const processNodeExcelJS = (node, level, ws, maxExec) => {
                    const isContainer = (node.children && Object.keys(node.children).length > 0) ||
                                        (node.grandchildren && Object.keys(node.grandchildren).length > 0) ||
                                        (node.greatGrandchildren && Object.keys(node.greatGrandchildren).length > 0);

                    // 1. Chuẩn bị mảng dữ liệu cơ bản
                    const rData = [
                        convertTT(node.tt), node.noiDung || '', node.tagName || '', node.dvThucHien || '',
                        (node.tanSuatTH === 0 || node.tanSuatTH == null) ? '' : node.tanSuatTH,
                        node.donVi || '',
                        (isContainer && level === 0) ? (node.soLuong || 0) : (node.soLuong || 0),
                        node.chiPhi || 0, node.chiPhiThucHien || 0,
                        0, // Kế hoạch còn lại (sẽ chèn formula)
                        node.namPhanBo || '', 0, // CP Phân bổ (sẽ chèn formula)
                        node.capDo || '', 0 // CP Cấp 1 (sẽ chèn formula)
                    ];

                    if (node.executions) {
                        for (let k in node.executions) {
                            const e = node.executions[k];
                            const idx = parseInt(e.lanThucHien || k, 10);
                            if (!isNaN(idx) && idx <= maxExec) {
                                const off = 14 + (idx - 1) * 4;
                                rData[off] = e.ngayThucHien || ''; rData[off+1] = e.dvt || 0;
                                rData[off+2] = e.donGia || 0; rData[off+3] = e.thanhTien || 0;
                            }
                        }
                    }
                    for(let i=0; i<14 + maxExec*4; i++) if(rData[i] === undefined) rData[i] = '';

                    const row = ws.addRow(rData);
                    const rIdx = row.number;

                    // 2. Đệ quy xử lý các node con để lấy số thứ tự dòng (phục vụ hàm SUM)
                    const childRows = [];
                    if (node.children) Object.keys(node.children).map(id=>({id,...node.children[id]})).sort(sortC).forEach(c=>childRows.push(...processNodeExcelJS(c, level+1, ws, maxExec)));
                    if (node.grandchildren) Object.keys(node.grandchildren).map(id=>({id,...node.grandchildren[id]})).sort((a,b)=>parseInt(a.id)-parseInt(b.id)).forEach(c=>childRows.push(...processNodeExcelJS(c, level+1, ws, maxExec)));
                    if (node.greatGrandchildren) Object.keys(node.greatGrandchildren).map(id=>({id,...node.greatGrandchildren[id]})).sort(sortN).forEach(c=>childRows.push(...processNodeExcelJS(c, level+1, ws, maxExec)));
                    if (node.greatGreatGrandchildren) Object.keys(node.greatGreatGrandchildren).map(id=>({id,...node.greatGreatGrandchildren[id]})).sort(sortN).forEach(c=>childRows.push(...processNodeExcelJS(c, level+1, ws, maxExec)));

                    // 3. Chèn công thức Excel (MAPPING COLUMNS: H=8, I=9, J=10, K=11, L=12, M=13, N=14)
                    const addr = (col) => row.getCell(col).address;
                    
                    if (isContainer && childRows.length > 0) {
                        const sumStr = (col) => `SUM(${childRows.map(r => ws.getRow(r).getCell(col).address).join(',')})`;
                        row.getCell(8).value = { formula: sumStr(8) };
                        row.getCell(9).value = { formula: sumStr(9) };
                        row.getCell(12).value = { formula: sumStr(12) };
                        row.getCell(14).value = { formula: sumStr(14) };
                    } else {
                        // Formula cho các Node Lá (Tính phân bổ và Cấp 1)
                        if (level >= 3) {
                            row.getCell(12).value = { formula: `IF(ISNUMBER(${addr(11)}), IF(${addr(11)}>0, ${addr(8)}/${addr(11)}, 0), 0)` };
                            row.getCell(14).value = { formula: `IF(${addr(13)}="1", ${addr(8)}, IF(${addr(13)}="6t", ${addr(8)}*0.5, 0))` };
                        }
                    }
                    
                    // Kế hoạch còn lại (Chặn PS)
                    const isPs = node.capDo && String(node.capDo).trim().toLowerCase() === 'ps';
                    if (level !== 4 && !isPs) row.getCell(10).value = { formula: `${addr(8)}-${addr(9)}` };
                    else row.getCell(10).value = null;

                    // 4. Áp dụng Format và Styling (Màu sắc, in đậm, căn lề)
                    [7, 8, 9, 10, 12, 14].forEach(c => row.getCell(c).numFmt = '#,##0');
                    for (let i = 1; i <= maxExec; i++) {
                        row.getCell(14 + (i-1)*4 + 2).numFmt = '#,##0'; // Số lượng
                        row.getCell(14 + (i-1)*4 + 3).numFmt = '#,##0'; // Đơn giá
                        row.getCell(14 + (i-1)*4 + 4).numFmt = '#,##0'; // Thành tiền
                    }

                    const colors = ['FFC5D9F1', 'FFE4DFEC', 'FFF2DCDB', 'FFEBF1DE', 'FFFFFFFF', 'FFFFE599'];
                    const bgColor = colors[level] || 'FFFFFFFF'; 
                    
                    row.eachCell({ includeEmpty: true }, (cell) => {
                        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bgColor } };
                        cell.border = { top: { style: 'thin', color: { argb: 'FFD9D9D9' } }, left: { style: 'thin', color: { argb: 'FFD9D9D9' } }, bottom: { style: 'thin', color: { argb: 'FFD9D9D9' } }, right: { style: 'thin', color: { argb: 'FFD9D9D9' } } };
                        if (level < 3) cell.font = { bold: true };
                    });
                    
                    row.getCell(2).alignment = { wrapText: true, indent: level };
                    row.outlineLevel = level; // Cho phép đóng/mở cấp độ (Group/Collapse) trong Excel

                    return [rIdx];
                };

                btn.innerHTML = "⏳ Đang quét dữ liệu...";

                // --- DUYỆT QUA CÁC CSDL VÀ ÁNH XẠ VÀO SHEET ---
                for (const item of window.activeDatabaseInstances) {
                    const conf = item.config;
                    
                    const snap = await get(ref(item.dbObj, `congViecMe${year}`));
                    if (!snap.exists()) continue;
                    
                    const sumSnap = await get(ref(item.dbObj, `summary_data/${year}`));
                    const sumData = sumSnap.exists() ? sumSnap.val() : {};

                    const parentsData = snap.val();
                    const parents = Object.keys(parentsData).map(id=>({id,...parentsData[id]})).sort((a,b)=>a.id.localeCompare(b.id));
                    parents.forEach(p => { if(sumData[p.id]) p.soLuong = sumData[p.id].totalLeafNodesCap1 || 0; });

                    // -- NHÓM RIGHT (Chia sheet theo A, B, C...) --
                    if (conf.sheetNames && Array.isArray(conf.sheetNames)) {
                        for (let i = 0; i < parents.length; i++) {
                            if (i >= conf.sheetNames.length) break; 
                            
                            const ws = workbook.getWorksheet(conf.sheetNames[i]);
                            if (!ws) continue; 

                            const pNode = parents[i];
                            const maxExec = findMaxExecutions(pNode);
                            
                            setupWorksheetHeader(ws, maxExec);
                            processNodeExcelJS(pNode, 0, ws, maxExec);
                        }
                    } 
                    // -- NHÓM LEFT (Gộp tất cả vào 1 sheet) --
                    else if (conf.sheetName) {
                        const ws = workbook.getWorksheet(conf.sheetName);
                        if (!ws) continue;

                        let maxExec = 0;
                        parents.forEach(p => {
                            const m = findMaxExecutions(p);
                            if (m > maxExec) maxExec = m;
                        });

                        setupWorksheetHeader(ws, maxExec);
                        for (const p of parents) {
                            processNodeExcelJS(p, 0, ws, maxExec);
                        }
                    }
                }

                btn.innerHTML = "⏳ Đang tạo file...";

                // Xuất file
                const outBuffer = await workbook.xlsx.writeBuffer();
                const blob = new Blob([outBuffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `TongHop_ATCLMT_${year}.xlsx`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);

            } catch (error) {
                console.error(error);
                alert("Lỗi xuất báo cáo: " + error.message);
            } finally {
                btn.innerHTML = originHtml;
                btn.disabled = false;
            }
        };
        document.addEventListener('DOMContentLoaded', initializeSystem);
    </script>
    
</body>
